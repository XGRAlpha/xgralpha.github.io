name: Patch CRM menu

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-crm-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch files
        run: |
          python3 <<'PY'
          from pathlib import Path

          crm_link = '    <a href="crm-comercial.html">CRM Comercial</a>\n'
          targets = [Path('diagnostico-xgreat.html'), Path('projetos.html')]

          changed = False
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if 'href="crm-comercial.html"' in text:
                  continue
              marker = '    <a href="automacao.html">Soluções</a>\n'
              if marker not in text:
                  raise SystemExit(f'Marcador não encontrado em {path}')
              text = text.replace(marker, marker + crm_link, 1)
              path.write_text(text, encoding='utf-8')
              changed = True

          if changed:
              print('CRM menu patched.')
          else:
              print('No changes needed.')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico-xgreat.html projetos.html
          git commit -m "Corrige menu CRM em Diagnostico e Projetos"
          git push
