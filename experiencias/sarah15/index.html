<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eadcf1">
  <meta name="description" content="Você recebeu um convite especial para celebrar os 15 anos da Sarah.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sarah — 15 anos">
  <meta property="og:description" content="Um convite especial espera por você. Toque para abrir.">
  <meta property="og:url" content="https://xgreat.com.br/experiencias/sarah15/">
  <title>Sarah — 15 anos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#3a2743;
      --plum:#694079;
      --violet:#8d62a1;
      --lilac:#d9bfe5;
      --mist:#f7f0f9;
      --paper:#fffdfc;
      --silver:#918d99;
      --gold:#c2a46e;
    }

    *{box-sizing:border-box}
    html,body{min-height:100%}
    html{background:#e9dcef}
    body{
      margin:0;
      overflow:hidden;
      color:var(--ink);
      font-family:Montserrat,Arial,sans-serif;
      background:
        radial-gradient(circle at 50% 22%,rgba(255,255,255,.98) 0 10%,rgba(251,247,252,.82) 35%,transparent 63%),
        linear-gradient(145deg,#f3e8f5 0%,#ead9f0 50%,#d9c1e3 100%);
    }

    button{font:inherit}

    .experience{
      position:relative;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:max(20px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
      isolation:isolate;
      transition:filter .75s ease,opacity .75s ease,transform .75s ease;
    }

    .experience::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-4;
      pointer-events:none;
      opacity:.22;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitchTiles'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E");
      mix-blend-mode:multiply;
    }

    .ambient{
      position:fixed;
      inset:0;
      z-index:-3;
      overflow:hidden;
      pointer-events:none;
    }

    .ambient::before,.ambient::after{
      content:"";
      position:absolute;
      border-radius:50%;
      filter:blur(52px);
      opacity:.42;
    }

    .ambient::before{width:48vw;height:48vw;left:-18vw;top:-20vw;background:#fffdf6}
    .ambient::after{width:56vw;height:56vw;right:-25vw;bottom:-29vw;background:#a77aba}

    .petal-field{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
    .petal{
      position:absolute;
      left:var(--x);
      top:var(--y);
      width:var(--s);
      height:calc(var(--s)*.74);
      opacity:var(--o);
      filter:drop-shadow(0 5px 8px rgba(89,54,104,.13));
      animation:petal-drift var(--d) ease-in-out infinite alternate;
    }
    .petal::before,.petal::after{
      content:"";
      position:absolute;
      top:0;
      width:55%;
      height:100%;
      background:linear-gradient(145deg,rgba(217,187,229,.95),rgba(137,91,158,.54));
      border:1px solid rgba(113,70,131,.12);
    }
    .petal::before{right:48%;border-radius:92% 18% 82% 28%;transform-origin:right center;animation:wing-left .78s ease-in-out infinite alternate}
    .petal::after{left:48%;border-radius:18% 92% 28% 82%;transform-origin:left center;animation:wing-right .78s ease-in-out infinite alternate}

    @keyframes petal-drift{
      0%{transform:translate3d(0,0,0) rotate(-5deg)}
      50%{transform:translate3d(calc(var(--dx)*.55),-14px,0) rotate(7deg)}
      100%{transform:translate3d(var(--dx),-27px,0) rotate(-3deg)}
    }
    @keyframes wing-left{to{transform:perspective(70px) rotateY(58deg)}}
    @keyframes wing-right{to{transform:perspective(70px) rotateY(-58deg)}}

    .opening{
      width:min(100%,640px);
      display:grid;
      justify-items:center;
      text-align:center;
    }

    .opening-kicker{
      margin:0 0 11px;
      color:#805d8e;
      font-size:clamp(.59rem,1.8vw,.71rem);
      font-weight:500;
      letter-spacing:.42em;
      text-transform:uppercase;
    }

    .opening-title{
      margin:0;
      color:#4f315c;
      font:400 clamp(2.7rem,8.3vw,5.5rem)/.92 "Bodoni Moda",serif;
      letter-spacing:-.055em;
      text-wrap:balance;
      text-shadow:0 2px 0 rgba(255,255,255,.8);
    }

    .opening-copy{
      min-height:24px;
      margin:15px 0 2px;
      color:#705c75;
      font:italic clamp(1rem,3vw,1.22rem)/1.4 "Cormorant Garamond",serif;
    }

    .scene{
      position:relative;
      width:min(84vw,410px);
      aspect-ratio:1.46;
      margin:clamp(24px,5vh,42px) auto 8px;
      perspective:1200px;
      cursor:pointer;
      filter:drop-shadow(0 25px 30px rgba(66,39,76,.25));
      transition:transform .35s ease,filter .35s ease;
    }

    .scene:hover{transform:translateY(-5px);filter:drop-shadow(0 31px 34px rgba(66,39,76,.3))}
    .scene:focus-visible{outline:3px solid #815a93;outline-offset:12px;border-radius:16px}

    .envelope{
      position:absolute;
      inset:16% 0 0;
      border-radius:9px 9px 15px 15px;
      background:linear-gradient(145deg,#d6bddd,#fbf6fc 57%,#c4a0d0);
      box-shadow:inset 0 0 0 1px rgba(92,53,108,.12);
    }

    .letter-peek{
      position:absolute;
      z-index:2;
      left:6%;right:6%;bottom:7%;height:93%;
      display:grid;
      place-items:start center;
      padding-top:12%;
      border:1px solid rgba(118,83,129,.16);
      border-radius:5px;
      color:#7b508b;
      background:linear-gradient(145deg,#fffefc,#f9eff9);
      font:400 2.5rem/1 Allura,cursive;
      transition:transform 1.05s cubic-bezier(.2,.76,.25,1),opacity .55s ease;
    }

    .envelope::before,.envelope::after{content:"";position:absolute;inset:0;border-radius:inherit}
    .envelope::before{
      z-index:3;
      clip-path:polygon(0 0,50% 61%,100% 0,100% 100%,0 100%);
      background:linear-gradient(153deg,#f6edf9 0 48%,#d1b2dc 49%);
    }
    .envelope::after{
      z-index:4;
      clip-path:polygon(0 100%,0 35%,50% 76%,100% 35%,100% 100%);
      background:linear-gradient(170deg,transparent 0 48%,rgba(179,142,194,.32) 49%);
    }

    .flap{
      position:absolute;
      z-index:5;
      top:0;left:0;width:100%;height:64%;
      clip-path:polygon(0 0,100% 0,50% 100%);
      background:linear-gradient(155deg,#faf2fb,#caa9d6);
      transform-origin:top;
      backface-visibility:hidden;
      transition:transform 1s cubic-bezier(.68,-.1,.25,1.15),z-index 0s .48s;
    }

    .seal{
      position:absolute;
      z-index:8;
      left:50%;top:58%;
      display:grid;
      place-items:center;
      width:78px;height:70px;
      border:0;
      border-radius:50%;
      color:#fff1ef;
      background:
        radial-gradient(circle at 34% 24%,rgba(234,185,242,.8),transparent 22%),
        radial-gradient(circle,#9f5fb4 0 58%,#77428b 61%,#633274 72%);
      box-shadow:0 5px 12px rgba(67,25,76,.35),inset 0 0 0 4px rgba(255,225,251,.14);
      font:500 .82rem/1 "Bodoni Moda",serif;
      letter-spacing:.16em;
      text-transform:uppercase;
      transform:translate(-50%,-50%);
      cursor:pointer;
      transition:transform .4s ease,opacity .35s ease;
    }
    .seal::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,231,248,.5);border-radius:50%}

    .opening-hint{
      border:0;
      padding:8px 12px;
      color:#714d80;
      background:transparent;
      font-size:.66rem;
      font-weight:500;
      letter-spacing:.2em;
      text-transform:uppercase;
      cursor:pointer;
      animation:breathe 2.2s ease-in-out infinite;
    }
    .opening-hint::before{content:"✦";margin-right:9px;color:#a875b8}
    @keyframes breathe{50%{opacity:.5;transform:translateY(2px)}}

    .invite-layer{
      position:fixed;
      z-index:20;
      inset:0;
      display:grid;
      place-items:center;
      padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));
      visibility:hidden;
      opacity:0;
      background:rgba(228,213,236,.72);
      backdrop-filter:blur(15px);
      transition:opacity .75s ease .72s,visibility 0s 1.5s;
    }

    .invitation{
      position:relative;
      width:min(94vw,470px);
      height:min(94svh,800px);
      min-height:min(620px,94svh);
      overflow:hidden;
      border:1px solid rgba(109,74,124,.3);
      border-radius:7px;
      color:#3e2a46;
      text-align:center;
      background:
        radial-gradient(ellipse at 50% 5%,rgba(255,255,255,.98),transparent 38%),
        radial-gradient(ellipse at 15% 98%,rgba(175,138,196,.34),transparent 35%),
        radial-gradient(ellipse at 92% 93%,rgba(205,181,220,.42),transparent 38%),
        linear-gradient(180deg,#fff 0%,#fdfafd 38%,#f2e5f6 100%);
      box-shadow:0 34px 90px rgba(52,28,62,.34);
      transform:translateY(86px) scale(.92);
      transition:transform 1.05s cubic-bezier(.17,.84,.25,1) .72s;
      isolation:isolate;
    }

    .invitation::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-3;
      opacity:.3;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
      mix-blend-mode:multiply;
    }

    .invitation::after{
      content:"";
      position:absolute;
      inset:12px;
      z-index:15;
      border:1px solid rgba(169,139,93,.55);
      border-radius:4px;
      pointer-events:none;
    }

    .inner-frame{position:absolute;inset:18px;z-index:14;border:1px solid rgba(113,78,128,.13);border-radius:3px;pointer-events:none}

    .watercolor{
      position:absolute;
      z-index:-2;
      left:-12%;right:-12%;bottom:-5%;height:43%;
      opacity:.76;
      background:
        radial-gradient(ellipse at 9% 82%,rgba(130,91,153,.5),transparent 31%),
        radial-gradient(ellipse at 30% 75%,rgba(198,167,215,.55),transparent 35%),
        radial-gradient(ellipse at 65% 80%,rgba(169,128,191,.42),transparent 38%),
        radial-gradient(ellipse at 94% 70%,rgba(111,72,136,.42),transparent 31%);
      filter:blur(6px);
      transform:rotate(-2deg);
    }

    .star-field{position:absolute;inset:0;z-index:2;pointer-events:none}

    .glow-sweep{
      position:absolute;
      z-index:4;
      inset:-30%;
      pointer-events:none;
      opacity:0;
      background:linear-gradient(112deg,transparent 41%,rgba(255,255,255,.08) 46%,rgba(255,246,221,.5) 50%,rgba(255,255,255,.08) 54%,transparent 59%);
      transform:translateX(-72%) rotate(-4deg);
      mix-blend-mode:screen;
    }
    body.open .glow-sweep{animation:magic-sweep 1.7s ease 4.35s forwards}
    @keyframes magic-sweep{
      0%{opacity:0;transform:translateX(-72%) rotate(-4deg)}
      18%{opacity:.55}
      82%{opacity:.4}
      100%{opacity:0;transform:translateX(72%) rotate(-4deg)}
    }
    .star{
      position:absolute;
      left:var(--x);top:var(--y);
      color:var(--c,#b89ac4);
      font-size:var(--s);
      opacity:0;
      text-shadow:0 0 13px rgba(163,121,183,.58);
    }
    body.open .star{animation:twinkle 2.6s ease-in-out var(--delay) infinite}
    @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.65) rotate(0)}50%{opacity:.94;transform:scale(1.15) rotate(25deg)}}

    .filigree{
      position:absolute;
      z-index:3;
      width:126px;
      height:126px;
      opacity:.72;
      color:#856595;
      pointer-events:none;
    }
    .filigree.top-left{left:-4px;top:-3px}
    .filigree.bottom-right{right:-4px;bottom:-3px;transform:rotate(180deg)}

    .bird-flight{position:absolute;z-index:3;left:18px;right:18px;top:23px;height:108px;pointer-events:none}
    .butterfly{position:absolute;width:86px;height:60px;overflow:visible;opacity:0;color:#8c64a0;filter:drop-shadow(0 7px 7px rgba(76,49,91,.18))}
    .butterfly.one{left:7%;top:22px;transform:rotate(-9deg)}
    .butterfly.two{left:38%;top:-2px;transform:rotate(5deg) scale(.78)}
    .butterfly.three{right:4%;top:24px;transform:rotate(11deg)}
    .butterfly .wing{transform-box:fill-box}
    .butterfly .wing-left{transform-origin:right center;animation:butterfly-wing-left .72s ease-in-out infinite alternate}
    .butterfly .wing-right{transform-origin:left center;animation:butterfly-wing-right .72s ease-in-out infinite alternate}
    .butterfly .wing-detail{fill:none;stroke:rgba(255,255,255,.72);stroke-width:1.5;stroke-linecap:round}
    .butterfly .body{fill:#593968}
    body.open .butterfly{animation:butterfly-in .95s cubic-bezier(.2,.75,.25,1) forwards,butterfly-hover 2.35s ease-in-out 2.15s infinite alternate}
    body.open .butterfly.one{animation-delay:1s,2.15s}
    body.open .butterfly.two{animation-delay:1.12s,2.28s}
    body.open .butterfly.three{animation-delay:1.24s,2.4s}
    @keyframes butterfly-in{from{opacity:0;translate:-24px 18px}to{opacity:.84;translate:0 0}}
    @keyframes butterfly-hover{from{translate:0 0}to{translate:9px -10px}}
    @keyframes butterfly-wing-left{to{transform:perspective(90px) rotateY(54deg)}}
    @keyframes butterfly-wing-right{to{transform:perspective(90px) rotateY(-54deg)}}

    .invite-content{
      position:relative;
      z-index:5;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:clamp(56px,8svh,82px) 34px 34px;
    }

    .reserve{
      margin:0 0 clamp(11px,2svh,20px);
      color:#8a6898;
      font-size:clamp(.51rem,1.4vw,.62rem);
      font-weight:500;
      letter-spacing:.42em;
      text-transform:uppercase;
      opacity:0;
      transform:translateY(-8px);
    }
    body.open .reserve{animation:rise .8s ease 1.05s forwards}

    .ribbon-wrap{
      position:relative;
      width:min(100%,360px);
      height:130px;
      margin-top:2px;
      opacity:0;
      transform:scale(.94);
    }
    body.open .ribbon-wrap{animation:ribbon-in .8s ease 1.15s forwards}
    @keyframes ribbon-in{to{opacity:1;transform:scale(1)}}

    .ribbon{
      position:absolute;
      left:1%;right:1%;top:34px;height:67px;
      background:linear-gradient(180deg,#c4a8d2 0%,#ae89c1 55%,#9872ad 100%);
      clip-path:polygon(0 22%,13% 9%,20% 18%,80% 18%,87% 9%,100% 22%,91% 52%,100% 88%,80% 82%,74% 100%,26% 100%,20% 82%,0 88%,9% 52%);
      filter:drop-shadow(0 8px 7px rgba(73,46,87,.16));
      opacity:.86;
    }
    .ribbon::before{content:"";position:absolute;inset:13px 19%;border-top:1px solid rgba(255,255,255,.38);border-bottom:1px solid rgba(90,50,104,.15)}

    .name-svg{position:absolute;z-index:3;inset:0;width:100%;height:100%;overflow:visible}
    .name-svg text{
      font-family:Allura,cursive;
      font-size:92px;
      fill:#5e3d6c;
      filter:drop-shadow(0 4px 6px rgba(67,38,77,.12));
    }
    .name-mask-rect{width:0}
    body.open .name-mask-rect{animation:reveal-name 2.65s cubic-bezier(.26,.68,.22,1) 1.62s forwards}
    @keyframes reveal-name{to{width:100%}}

    .quill{
      position:absolute;
      z-index:7;
      left:23px;top:21px;
      width:92px;height:102px;
      opacity:0;
      transform:translate(-18px,8px) rotate(-13deg);
      transform-origin:20px 86px;
      filter:drop-shadow(0 8px 6px rgba(52,30,63,.22));
      pointer-events:none;
    }
    body.open .quill{animation:quill-write 2.7s cubic-bezier(.25,.66,.2,1) 1.56s forwards}
    @keyframes quill-write{
      0%{opacity:0;transform:translate(-18px,7px) rotate(-13deg)}
      7%{opacity:1}
      22%{transform:translate(52px,-4px) rotate(-7deg)}
      42%{transform:translate(105px,10px) rotate(-12deg)}
      61%{transform:translate(160px,-4px) rotate(-5deg)}
      82%{opacity:1;transform:translate(221px,9px) rotate(-10deg)}
      100%{opacity:0;transform:translate(259px,-8px) rotate(-4deg)}
    }

    .ink-spark{
      position:absolute;
      z-index:4;
      right:28px;top:73px;
      width:22px;height:22px;
      border-radius:50%;
      opacity:0;
      background:radial-gradient(circle,#694179 0 12%,transparent 14%),radial-gradient(circle at 18% 24%,#8d66a0 0 7%,transparent 9%),radial-gradient(circle at 72% 20%,#8d66a0 0 5%,transparent 7%),radial-gradient(circle at 84% 75%,#8d66a0 0 6%,transparent 8%);
    }
    body.open .ink-spark{animation:ink-pop .6s ease 4.06s forwards}
    @keyframes ink-pop{0%{opacity:0;transform:scale(.25)}55%{opacity:.8;transform:scale(1.15)}100%{opacity:.48;transform:scale(1)}}

    .age-block{position:relative;margin-top:-3px;opacity:0;transform:translateY(13px)}
    body.open .age-block{animation:rise .9s ease 3.78s forwards}
    .age-number{
      display:block;
      color:rgba(94,80,100,.74);
      font:400 clamp(3.7rem,16vw,5.9rem)/.72 "Bodoni Moda",serif;
      letter-spacing:-.03em;
      text-shadow:0 1px 0 white;
    }
    .age-words{
      position:relative;
      z-index:2;
      display:block;
      margin-top:-2px;
      color:#a178b0;
      font:400 clamp(1.7rem,7vw,2.7rem)/1 Allura,cursive;
      transform:rotate(-3deg);
    }

    .anniversary{
      width:100%;
      margin:clamp(15px,2.6svh,24px) 0 0;
      color:#3e3441;
      font:400 clamp(1.75rem,7vw,2.65rem)/1 "Cinzel Decorative",serif;
      letter-spacing:.02em;
      opacity:0;
      transform:translateY(10px);
    }
    body.open .anniversary{animation:rise .95s ease 4.2s forwards}

    .ornament{
      width:min(240px,72%);
      display:flex;
      align-items:center;
      gap:12px;
      margin:clamp(15px,2.7svh,25px) 0 clamp(12px,2svh,19px);
      color:#8c699a;
      opacity:0;
    }
    .ornament::before,.ornament::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#ac8cba)}
    .ornament::after{background:linear-gradient(90deg,#ac8cba,transparent)}
    body.open .ornament{animation:rise .8s ease 4.52s forwards}

    .preview-message{
      max-width:340px;
      margin:0;
      color:#65566a;
      font:italic clamp(.98rem,3.7vw,1.23rem)/1.42 "Cormorant Garamond",serif;
      opacity:0;
      transform:translateY(9px);
    }
    body.open .preview-message{animation:rise .85s ease 4.68s forwards}

    .card-recipient{
      min-height:24px;
      margin:clamp(11px,2svh,18px) 0 0;
      color:#7d568d;
      font:400 clamp(1.25rem,5vw,1.7rem)/1 Allura,cursive;
      opacity:0;
      transform:translateY(8px);
    }
    body.open .card-recipient{animation:rise .85s ease 4.86s forwards}

    .details-soon{
      display:inline-flex;
      align-items:center;
      min-height:34px;
      margin-top:clamp(15px,2.8svh,25px);
      padding:8px 16px;
      border:1px solid rgba(129,90,145,.25);
      border-radius:999px;
      color:#79677e;
      background:rgba(255,255,255,.43);
      font-size:clamp(.48rem,1.35vw,.58rem);
      letter-spacing:.2em;
      text-transform:uppercase;
      opacity:0;
      transform:translateY(8px);
    }
    body.open .details-soon{animation:rise .85s ease 5.02s forwards}

    @keyframes rise{to{opacity:1;transform:translateY(0)}}

    .close-invite,.replay{
      position:absolute;
      z-index:20;
      display:grid;
      place-items:center;
      border:0;
      color:#72577b;
      background:rgba(255,255,255,.65);
      box-shadow:0 5px 15px rgba(65,39,73,.1);
      cursor:pointer;
      opacity:0;
      transition:background .25s ease,transform .25s ease;
    }
    .close-invite{top:22px;right:22px;width:40px;height:40px;border-radius:50%;font-size:1.35rem}
    .replay{right:22px;bottom:22px;width:auto;height:34px;padding:0 12px;border-radius:999px;font-size:.51rem;letter-spacing:.13em;text-transform:uppercase}
    body.open .close-invite,body.open .replay{animation:rise .6s ease 5.15s forwards}
    .close-invite:hover,.replay:hover{background:#fff;transform:translateY(-2px)}
    .close-invite:focus-visible,.replay:focus-visible{outline:2px solid #734c84;outline-offset:3px}

    body.open .flap{z-index:1;transform:rotateX(178deg)}
    body.open .letter-peek{transform:translateY(-78%);opacity:.45}
    body.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.65);pointer-events:none}

    @media(max-height:680px){
      .invitation{height:calc(100svh - 10px);min-height:0}

    @media(prefers-reduced-motion:reduce){

      .name-mask-rect{width:100%}

  <script>
    const params = new URLSearchParams(location.search);
    const recipient = (params.get("para") || "").trim().slice(0, 60).replace(/[<>]/g, "");
    const recipientIntro = document.getElementById("recipientIntro");
    const recipientCard = document.getElementById("recipientCard");
    const scene = document.getElementById("scene");
    const inviteLayer = document.getElementById("inviteLayer");
    const openHint = document.getElementById("openHint");
    const closeInvite = document.getElementById("closeInvite");
    const replay = document.getElementById("replay");

    if (recipient) {
      recipientIntro.textContent = recipient + ", este convite é para você.";
      recipientCard.textContent = "Com carinho, para " + recipient;
      document.title = recipient + " — convite de Sarah";
    }

    const petalField = document.getElementById("petalField");
    const positions = [
      [8,18,32,.34,5.8,-12],[18,71,22,.27,4.6,13],[34,11,18,.3,5.1,8],
      [70,16,24,.32,6.2,-15],[88,34,30,.4,5.4,14],[78,77,18,.29,4.7,-8],
      [52,89,25,.26,6.4,11],[5,86,17,.22,5.2,9],[94,73,20,.28,5.8,-13]
    ];
    positions.forEach(([x,y,s,o,d,dx]) => {
      const p = document.createElement("i");
      p.className = "petal";
      p.style.cssText = `--x:${x}%;--y:${y}%;--s:${s * 2}px;--o:${Math.min(o + .08, .52)};--d:${(d * .72).toFixed(2)}s;--dx:${dx * 1.7}px`;
      petalField.appendChild(p);
    });

    const starField = document.getElementById("starField");
    const stars = [[12,25,18,1.1],[84,18,13,1.6],[89,44,20,.9],[14,63,11,2.2],[78,69,15,1.3],[23,86,17,1.9],[68,91,10,.7],[91,84,13,2.5],[8,47,10,1.8],[31,18,8,.4],[72,31,9,2.1],[38,74,7,1.45],[58,58,11,2.75],[47,92,8,.95]];
    stars.forEach(([x,y,s,delay], index) => {
      const star = document.createElement("i");
      star.className = "star";
      star.textContent = index % 3 === 0 ? "✧" : "✦";
      star.style.cssText = `--x:${x}%;--y:${y}%;--s:${s}px;--delay:${delay}s`;
      starField.appendChild(star);
    });

    let opened = false;
    function openInvitation() {
      if (opened) return;
      opened = true;
      document.body.classList.add("open");
      scene.setAttribute("aria-expanded", "true");
      inviteLayer.setAttribute("aria-hidden", "false");
      window.setTimeout(() => closeInvite.focus({ preventScroll:true }), 5250);
    }

    function closeInvitation() {
      opened = false;
      document.body.classList.remove("open");
      scene.setAttribute("aria-expanded", "false");
      inviteLayer.setAttribute("aria-hidden", "true");
      window.setTimeout(() => scene.focus({ preventScroll:true }), 250);
    }

    function replayInvitation() {
      document.body.classList.remove("open");
      void document.body.offsetWidth;
      document.body.classList.add("open");
    }

    scene.addEventListener("click", openInvitation);
    openHint.addEventListener("click", openInvitation);
    scene.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openInvitation();
      }
    });
    closeInvite.addEventListener("click", closeInvitation);
    replay.addEventListener("click", replayInvitation);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && opened) closeInvitation();
    });
  </script>
